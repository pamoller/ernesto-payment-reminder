openapi: 3.0.3
info:
  title: Ernesto Payment Reminder API
  version: 0.1.0
paths:
  /api/auth/session:
    get:
      summary: Get login session and CSRF token
      responses:
        '200':
          description: Session status
  /api/auth/login:
    post:
      summary: Login administrator
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Login successful
        '401':
          description: Invalid credentials
        '419':
          description: Invalid CSRF token
        '429':
          description: Too many login attempts
  /api/auth/logout:
    post:
      summary: Logout administrator
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Logout successful
  /api/health:
    get:
      summary: System health
      responses:
        '200':
          description: Backend is available
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - ok
  /api/customers:
    get:
      summary: List customers
      responses:
        '200':
          description: Customer list
    post:
      summary: Create customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, duration_months, start_date]
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                duration_months:
                  type: integer
                  enum: [3, 6, 12]
                start_date:
                  type: string
                  format: date
      responses:
        '201':
          description: Customer created
        '422':
          description: Validation error
  /api/customers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Get customer
      responses:
        '200':
          description: Customer
        '404':
          description: Not found
    put:
      summary: Update customer
      responses:
        '200':
          description: Customer updated
        '404':
          description: Not found
        '422':
          description: Validation error
    delete:
      summary: Delete customer
      responses:
        '204':
          description: Customer deleted
        '404':
          description: Not found
  /api/customers/{id}/remind:
    post:
      summary: Send a reminder email immediately
      description: May be called before subscription expiry and replaces reminder_sent with the new send time.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Reminder email sent
        '404':
          description: Customer not found
        '409':
          description: Reminder state changed while sending was requested
        '419':
          description: Invalid CSRF token
        '502':
          description: SMTP delivery failed
