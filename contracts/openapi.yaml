openapi: 3.0.3
info:
  title: Ernesto Payment Reminder API
  version: 0.1.0
paths:
  /api/auth/session:
    get:
      summary: Get login session and CSRF token
      responses:
        '200':
          description: Session status
  /api/auth/login:
    post:
      summary: Login administrator
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Login successful
        '401':
          description: Invalid credentials
        '419':
          description: Invalid CSRF token
        '429':
          description: Too many login attempts
  /api/auth/logout:
    post:
      summary: Logout administrator
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Logout successful
  /api/health:
    get:
      summary: System health
      responses:
        '200':
          description: Backend is available
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - ok
  /api/customers:
    get:
      summary: List customers
      responses:
        '200':
          description: Customer list
    post:
      summary: Create customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, subscription_type_id, start_date]
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                subscription_type_id:
                  type: integer
                start_date:
                  type: string
                  format: date
      responses:
        '201':
          description: Customer created
        '422':
          description: Validation error
  /api/subscription-types:
    get:
      summary: List available subscription types
      responses:
        '200':
          description: Subscription types
  /api/subscription-statuses:
    get:
      summary: List available subscription status definitions
      responses:
        '200':
          description: Subscription status definitions
          content:
            application/json:
              schema:
                type: object
                required: [subscription_statuses]
                properties:
                  subscription_statuses:
                    type: array
                    items:
                      type: object
                      required: [id, name, duration, subject, message]
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        duration:
                          type: string
                          nullable: true
                        subject:
                          type: string
                          nullable: true
                        message:
                          type: string
                          nullable: true
  /api/customers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Get customer
      responses:
        '200':
          description: Customer
        '404':
          description: Not found
    put:
      summary: Update customer
      responses:
        '200':
          description: Customer updated
        '404':
          description: Not found
        '422':
          description: Validation error
    delete:
      summary: Delete customer
      responses:
        '204':
          description: Customer deleted
        '404':
          description: Not found
  /api/customers/{id}/remind:
    post:
      summary: Send a reminder email immediately
      description: May be called before subscription expiry and replaces reminder_sent with the new send time.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Reminder email sent
        '404':
          description: Customer not found
        '409':
          description: Reminder state changed while sending was requested
        '419':
          description: Invalid CSRF token
        '502':
          description: SMTP delivery failed
